<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ElectroStore</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        input,
        select {
            padding: 11px;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            background: white;
            outline: none;
        }

        input:focus,
        select:focus {
            border-color: #6366f1;
        }

        button {
            transition: 0.2s;
            border-radius: 9px;
            padding: 10px 16px;
            font-weight: 500;
        }

        button:hover {
            opacity: 0.8;
        }

        th,
        td {
            padding: 16px;
            text-align: left;
            white-space: nowrap;
        }

        td {
            border-bottom: 1px solid #f1f5f9;
        }

        .card {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 18px;
            padding: 24px;
            margin-bottom: 24px;
        }

        .primary {
            background: #18181b;
            color: white;
        }

        .secondary {
            background: #f1f5f9;
            color: #334155;
        }

        .danger {
            background: #fef2f2;
            color: #dc2626;
        }
    </style>
</head>

<body class="bg-slate-50 text-slate-900">

    <header class="bg-white border-b sticky top-0 z-10">
        <div class="max-w-6xl mx-auto px-6 py-5 flex justify-between items-center flex-wrap gap-4">
            <div>
                <h1 class="text-2xl font-bold tracking-tight">Electonics Store</h1>
                <p class="text-xs text-slate-500">E-Commerce Management</p>
            </div>
            <nav class="flex gap-2">
                <button id="productsBtn" onclick="productsPage()" class="primary">Products</button>
                <button id="ordersBtn" onclick="orderPage()" class="secondary">Orders</button>
            </nav>
        </div>
    </header>

    <main id="content" class="max-w-6xl mx-auto p-6 md:py-10"></main>
    <footer class="text-center text-xs text-slate-400 p-6">
        Electronics Store
    </footer>

</body>

</html>
