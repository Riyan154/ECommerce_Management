<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ElectroStore</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        input,
        select {
            padding: 11px;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            background: white;
            outline: none;
        }

        input:focus,
        select:focus {
            border-color: #6366f1;
        }

        button {
            transition: 0.2s;
            border-radius: 9px;
            padding: 10px 16px;
            font-weight: 500;
        }

        button:hover {
            opacity: 0.8;
        }

        th,
        td {
            padding: 16px;
            text-align: left;
            white-space: nowrap;
        }

        td {
            border-bottom: 1px solid #f1f5f9;
        }

        .card {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 18px;
            padding: 24px;
            margin-bottom: 24px;
        }

        .primary {
            background: #18181b;
            color: white;
        }

        .secondary {
            background: #f1f5f9;
            color: #334155;
        }

        .danger {
            background: #fef2f2;
            color: #dc2626;
        }
    </style>
</head>

<body class="bg-slate-50 text-slate-900">

    <header class="bg-white border-b sticky top-0 z-10">
        <div class="max-w-6xl mx-auto px-6 py-5 flex justify-between items-center flex-wrap gap-4">
            <div>
                <h1 class="text-2xl font-bold tracking-tight">Electonics Store</h1>
                <p class="text-xs text-slate-500">E-Commerce Management</p>
            </div>
            <nav class="flex gap-2">
                <button id="productsBtn" onclick="productsPage()" class="primary">Products</button>
                <button id="ordersBtn" onclick="orderPage()" class="secondary">Orders</button>
            </nav>
        </div>
    </header>

    <main id="content" class="max-w-6xl mx-auto p-6 md:py-10"></main>
    <footer class="text-center text-xs text-slate-400 p-6">
        Electronics Store
    </footer>

    <script>
        const content = document.getElementById("content")
        const categories = {{ categories | tojson}}
        const statuses = {{ statuses | tojson}}
        const payments = {{ payments | tojson}}
        let products = {}
        let editing = null

        function esc(v) {
            v = String(v);
            v = v.replaceAll("&", "&amp;");
            v = v.replaceAll("<", "&lt;");
            v = v.replaceAll(">", "&gt;");
            v = v.replaceAll('"', "&quot;");
            v = v.replaceAll("'", "&#39;");
            return v;
        }
        function options(list, selected = "") {
            return list.map(v =>
                `<option ${v === selected ? "selected" : ""}>${esc(v)}</option>`).join("");
        }

        async function api(url, method = "GET", body = null) {
            try {
                const config = { method, headers: { "Content-Type": "application/json" } }
                if (body !== null) config.body = JSON.stringify(body)
                const response = await fetch(url, config)
                const data = await response.json()

                if (!response.ok) throw new Error(data.message)
                if (method !== "GET") alert(data.message)
                return data
            } catch (e) {
                alert(e.message)
                return null
            }
        }

        function heading(title, subtitle) {
            return `<h2 class="text-3xl font-bold tracking-tight">${title}</h2>
            <p class="text-slate-500 mt-2 mb-8">${subtitle}</p>`
        }

        function navigation(page) {
            document.getElementById("productsBtn").className =
                page === "products" ? "primary " : "secondary"
            document.getElementById("ordersBrn").className =
                page === "orders" ? "primary" : "secondary"
        }

        async function productsPage() {
            products = await api("/api/products")
            if (!products) return
            editing = null
            navigation("products")

            content.innerHTML = `
                ${heading("Products", "Manage your product catalogue and inventory")}
                <section class="card">
                    <h3 id="formTitle" class="text-lg font-semibold mb-5">Add Products</h3>
                    <form id= "productForm" onsubmit="saveProduct(event)" class = "grid sm:grid-cols-2 lg:grid-cols-5 gap-3">
                        <input name="name" placeholder="Products name" required>
                        <input name="price" type="number" min="0.01" step="0.01" placeholder="Price (AED)" required>
                        <input name="stock" type ="number" min="0" placeholder="Stock quantity" required>
                        <select name="category">${options(categories)}</select>
                        <button class="primary">Save Product</button>
                    </form>
                </section>

                <section class="card">
                    <div class="flex flex-wrap gap-3 mb-5">
                        <input id="search" placeholder= "Search Products..." class="flex-1" oninput="searchProducts()">
                        <button class="secondary" onlclick="sortProducts()">Sort by Price</button>
                    </div>
                    <div id="productTable" class="overflow-x-auto"></div>
                </section>`
            productTable(products)
        }

        function productTable(items) {
            document.getElementById("productTable").innerHTML = `
            <table class="w-full text-sm">
                <thead class="bg-slate-50 text-slate-500">
                    <tr><th>Product</th><th>Category</th><th>Price</th><th>Stock</th><th>Actions</th></tr>
                    </thead>
                    <tbody>
                        ${Object.entries(items).map(([id, p]) => `
                        <tr>
                            <td class="font-semibond">${esc(p.name)}</td>
                            <td>${esc(p.category)}</td>
                            <td>AED ${p.price}</td>
                            <td><span class="${p.stock < 5 ? "text-orange-600" : "text-emerald-600"}">${p.stock}</span></td>
                            <td>
                                <button class="secondary" onclick="editProduct('${id}')">Edit</button>
                                <button class="danger" onclick="deleteProduct('${id}')">Delete</button>
                            </td>
                        </tr>`).join("")}
                </tbody>
            </table>
            ${Object.keys(items).length === 0 ? '<p class="text-center text-slate-400 py-10">No products found</p>' : ''}`
        }

        async function saveProduct(event) {
            event.preventDefault()
            const f = new FormData(event.target)
            const product = {
                name: f.get("name"),
                price: Number(f.get("price")),
                stock: Number(f.get("stock")),
                category: f.get("category")
            }
            const url = editing ? "/api/products/" + editing : "/api/products"
            if (await api(url, editing ? "PATCH" : "POST", product)) productPage()
        }

        function editProduct(id) {
            editing = id
            const form = document.getElementById("productForm")
            Object.entries(product[id].foreach(([key, value]) => {
                if (form.elements[key]) form.elements[key].value = value
            }))
            document.getElementById("formTitle").textContent = "Edit Product"
            window.scrollTo({ top: 0, behaviour: "smooth" })
        }

        async function deleteProduct(id) {
            if (confirm("Delete this product?")) {
                await api("/api/products/" + id, "DELETE")
                productsPage()
            }
        }

        async function searchProducts() {
            const q = document.getElementById("search").value
            const result = await api("/api/products/search?q=" + encodeURIComponent(q))
            if (result && document.getElementById("productTable")) productTable(result)

        }

        function sortProduct() {
            productTable(Object.fromEntries(
                Object.entries(products).sort((a, b) => a[1].price - b[1].price)
            ))
        }

        async function ordersPage() {
            products = await api("/api/products")
            const orders = await api("/api/orders")
            if (!products || !orders) return
            navigation("orders")

            content.innerHTML = `
                ${heading("Orders", "Create and manage customer orders")}
                <section class="card">
                    <h3 class= "text-lg font-semibold mb-5"">Create Order</h3>
                    <form onsubmit="addOrder(event)" class="grid sm:grid-cols-2 lg:grid-cols-5 gap-3">
                        <input name="customer" placeholder= "Customer name" required>
                        <select name= "product_id" required>
                            <option value="">Select product</option>
                            ${Object.entries(products).filter(([id, p]) => p.stock > 0).map(([id, p]) => `<option value="${id}">${esc(p.name)}</options>`).join("")}
                        </select>
                        <input name="quantity" type ="number" min="1" placeholder="Quantity" required>
                        <select name="payment_method">${options(payments)}</select>
                        <button class="primary">Place Order</button>
                    </form>
                    <p class="text-xs text-slate-400 mt-4">All payments are simulated</p>
                </section>
                <section class="card overflow-x-auto">
                    <h3 class="text-lg font-semibold mb-5">All Orders</h3>
                    <table class="w-full text-sm">
                        <thead class="bg-slate-50 text-slate-500">
                            <tr>
                                <th>Customer</th><th>Status</th><th>Quantity</th>
                                <th>Total></th><th>Status</th><th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${orders.map(o => `
                            <tr>
                                <td class="font-semibold">${esc(o.customer)}</td>
                                <td>${esc(o.product_name)}</td>
                                <td>${o.quantity}</td>
                                <td>AED ${o.total}</td>
                                <td>
                                    <select onchange="updateOrder('${o.id}',this.value)" 
                                        ${["Delivered", "Canceled"].includes(o.status) ? "disabled" : ""}>
                                    </select>
                                </td>
                                <td>
                                    <button class="danger" onclick="deleteOrder('${o.id}')">Delete</button>
                                </td>
                            
                            </tr>`).join("")}
                    </tbody>
                </table>
                ${orders.length === 0 ? '<p class="text-center text-slate-400 py-10">No orders yet</p>' : ''}
            </section>`

        }

        async function addOrder(event) {
            event.preventDefault()
            const f = new FormData(event.target)
            const order = {
                customer: f.get("customer"),
                product_id: f.get("product_id"),
                quantity: Number(f.get("quantity")),
                payment_method: f.get("payment_method")
            }
            if (await api("/api/orders", "POST", order)) ordersPage()
        }

        async function updateOrder(id, status) {
            await api("/api/order/" + id, "PATCH", { status })
            ordersPage()
        }

        async function deleteOrder(id) {
            if (confirm("Dlete this order?")) {
                await api("/api/order/" + id, "DELETE")
                ordersPage()
            }
        }

        productsPage()
    </script>

</body>

</html>
